<div class="main-registro-container" style="background-color: black; min-height: 100vh; padding: 2rem;">
  
  @if (isLogged()) {
    <div class="text-center text-white py-5">
      <h2 class="mb-4">Ya has iniciado sesión</h2>
      <a class="btn btn-outline-info" routerLink="/main">
        <i class="fas fa-home me-2"></i>Ir al inicio
      </a>
    </div>
  } @else {
    <div class="container d-flex justify-content-center">
      <div class="card shadow-lg" style="max-width: 500px; width: 100%;">
        <div class="card-header bg-dark">
          <ul class="nav nav-tabs card-header-tabs">
            <li class="nav-item">
              <a class="nav-link text-white-50" routerLink="/login">Iniciar Sesión</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" routerLink="/registro">Crear Cuenta</a>
            </li>
          </ul>
        </div>

        <div class="card-body p-4">
          <form #f="ngForm" (ngSubmit)="onRegister()" novalidate>
            
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre Completo</label>
              <input type="text" name="nombre" id="nombre" class="form-control"
                     [(ngModel)]="nombre" required placeholder="Tu nombre...">
            </div>

            <div class="mb-3">
              <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
              <input type="text" name="nombreUsuario" id="nombreUsuario" class="form-control"
                     [(ngModel)]="nombreUsuario" required placeholder="Ej: fgiunta">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" name="email" id="email" class="form-control"
                     [(ngModel)]="email" required email placeholder="ejemplo@correo.com">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" name="password" id="password" class="form-control"
                     [(ngModel)]="password" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>

            <div class="d-grid gap-2 mt-4">
              <button class="btn btn-success" [disabled]="!f.valid">
                <i class="fas fa-user-plus me-2"></i> Crear Cuenta
              </button>
              <button type="button" class="btn btn-outline-secondary" routerLink="/main">
                Cancelar
              </button>
            </div>
          </form>

          @if (errMsj()) {
            <div class="alert alert-danger mt-3 animate__animated animate__fadeIn">
              <i class="fas fa-exclamation-circle me-2"></i>
              {{ errMsj() }}
            </div>
          }
        </div>
      </div>
    </div>
  }
</div>
